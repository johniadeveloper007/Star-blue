<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina 3D - Equipo de Agentes de IA</title>
    <!-- Tailwind CSS para UI moderna y responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js para renderizado 3D realista -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls para navegación fluida en el entorno 3D -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b1120;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* Barra de desplazamiento personalizada para la bitácora */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.6);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        /* Globos de diálogo flotantes en 3D */
        .speech-bubble {
            position: absolute;
            transform: translate(-50%, -100%);
            background: rgba(15, 23, 42, 0.94);
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 14px;
            padding: 7px 12px;
            font-size: 11px;
            line-height: 1.35;
            max-width: 215px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.65);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 15;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: rgba(15, 23, 42, 0.94) transparent transparent transparent;
        }
    </style>
</head>
<body class="text-slate-100 antialiased">

    <!-- Contenedor Principal del Lienzo 3D -->

    <!-- Capa para globos de diálogo 3D proyectados -->
    <div id="speech-layer" class="fixed inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Pantalla de Carga Inicial -->

                <button onclick="sendAllToDesks()" class="px-2.5 py-1.5 rounded-xl bg-sky-500/20 hover:bg-sky-500/35 border border-sky-400/30 text-[11px] font-semibold text-sky-200 transition flex items-center gap-1" title="Enviar a todos a sus escritorios">

                    <span class="hidden md:inline">A Puestos</span>
                </button>
                <div class="h-4 w-px bg-slate-700 mx-0.5"></div>
                <button id="speed-btn" onclick="cycleSimSpeed()" class="px-2.5 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-[11px] font-semibold text-slate-200 transition" title="Velocidad de movimiento e interacción">
                    ⏩ 1x

            <button onclick="focusCamera('overview')" class="glass-panel hover:bg-slate-800/90 text-xs font-medium px-3 py-2 rounded-2xl transition shadow-lg flex items-center gap-1.5">

                <span class="hidden sm:inline">Vista General</span>
            </button>
            <button id="toggle-log-btn" onclick="toggleLogPanel()" class="glass-panel hover:bg-slate-800/90 text-xs font-medium px-3 py-2 rounded-2xl transition shadow-lg flex items-center gap-1.5 border-sky-500/40">
                <span>📋</span>
                <span>Bitácora</span>
            </button>
        </div>
    </header>

    <!-- Panel Lateral Derecho: Bitácora del Equipo y Controles de Mensaje -->
    <aside id="log-panel" class="fixed top-20 right-3 bottom-20 w-80 sm:w-96 z-20 glass-panel rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-transform duration-300 translate-x-0">
        <div class="px-4 py-3 border-b border-slate-700/70 flex items-center justify-between bg-slate-900/50">

            </div>
            <button onclick="triggerAutoDialogue()" class="text-[11px] bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/30 px-2.5 py-1 rounded-xl transition font-medium">

        <!-- Lista de mensajes de la bitácora -->
        <div id="log-feed" class="flex-1 overflow-y-auto p-3.5 space-y-2.5 text-xs">
            <!-- Se llena dinámicamente con JS -->
        </div>

        <!-- Formulario para actualizar el mensaje de un agente -->
        <form id="message-form" onsubmit="handlePostMessage(event)" class="p-3 border-t border-slate-700/70 bg-slate-900/70 space-y-2">
            <div class="flex items-center gap-2">
                <label for="agent-select" class="text-[11px] text-slate-400 font-medium">Agente:</label>
                <select id="agent-select" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-sky-500">
                    <option value="ribe">Ribe (Líder)</option>
                    <option value="pedro">Pedro (Backend)</option>
                    <option value="juanse">Juan se (APIs)</option>
                    <option value="perseo">Perseo (Bases de Datos)</option>
                    <option value="frontend">Frontend (Ana & Sofía)</option>
                </select>
            </div>
            <div class="flex gap-1.5">
                <input id="message-input" type="text" maxlength="85" placeholder="Publicar avance en su cartel..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-sky-500" required>
                <button type="submit" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold px-3.5 py-1.5 rounded-xl text-xs transition shadow-md">
                    Enviar

    <!-- Selector Rápido Inferior de Estaciones y Personajes -->

        // Guiones para partidos de Ping Pong
        const PINGPONG_SCRIPTS = [
            {

        // Guiones para el Rincón Gamer / Arcade
        const GAMING_SCRIPTS = [

        // Historial inicial de la bitácora del equipo
        const teamLogs = [

        // Variables globales de Three.js
        let scene, camera, renderer, controls;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let pingPongBallMesh = null;

        // Estado de cámara y simulación
        let cameraTargetPos = new THREE.Vector3(0, 10.5, 13.5);
        let cameraLookAtTarget = new THREE.Vector3(0, 1.0, 0.2);
        let isCameraTransitioning = false;
        let followedCharId = null;
        let simSpeed = 1;
        let simTimer = 0;

        /**
         * INICIALIZACIÓN DE LA ESCENA 3D
         */
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1220);
            scene.fog = new THREE.FogExp2(0x0b1220, 0.017);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.copy(cameraTargetPos);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2 - 0.04;
            controls.minDistance = 2.8;
            controls.maxDistance = 24;
            controls.target.copy(cameraLookAtTarget);

            controls.addEventListener('start', () => {
                isCameraTransitioning = false;
            });

            setupLighting();
            buildOfficeEnvironment();
            buildAllAgentStations();
            renderDeskNav();
            renderLogFeed();
            setupEvents();

            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 700);
                setTimeout(() => triggerPairInteraction(), 2200);
            }, 600);

            animate();
        }

        /**
         * ILUMINACIÓN ARQUITECTÓNICA Y RECREATIVA REALISTA
         */
        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xe2e8f0, 0x1e293b, 0.72);
            hemiLight.position.set(0, 12, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.05);
            dirLight.position.set(9, 15, 9);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 2;
            dirLight.shadow.camera.far = 36;
            const d = 13;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            // Luz cálida zona café y snacks
            const coffeeLight = new THREE.PointLight(0xffedd5, 0.75, 10);
            coffeeLight.position.set(7.2, 3.2, -4.8);
            scene.add(coffeeLight);

            // Luz cenital sobre la mesa de Ping Pong (ala delantera izquierda)
            const pingPongLight = new THREE.PointLight(0x38bdf8, 0.75, 9);
            pingPongLight.position.set(-5.8, 3.4, 6.2);
            scene.add(pingPongLight);

            // Luz neón púrpura/cian en el Rincón Gamer (ala delantera derecha)
            const gamerLight = new THREE.PointLight(0xc084fc, 0.9, 9);
            gamerLight.position.set(5.8, 3.1, 6.2);
            scene.add(gamerLight);

            // Luz central de reuniones
            const centerLight = new THREE.PointLight(0xe0f2fe, 0.55, 11);
            centerLight.position.set(0, 4.2, 0.5);
            scene.add(centerLight);
        }

        /**
         * CONSTRUCCIÓN DEL ENTORNO DE LA OFICINA, ZONA DE CAFÉ/SNACKS, PING PONG Y RINCÓN GAMER
         */
        function buildOfficeEnvironment() {
            const officeGroup = new THREE.Group();

            // Piso de madera laminada / concreto pulido con patrón procedural
            const floorTex = createFloorTexture();
            const floorMat = new THREE.MeshStandardMaterial({
                map: floorTex,
                roughness: 0.36,
                metalness: 0.08
            });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(21, 19), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            officeGroup.add(floor);

            // Alfombra central bajo mesa de reuniones
            const rugMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.88 });
            const rug = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 3.8), rugMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.005, 0.4);
            rug.receiveShadow = true;
            officeGroup.add(rug);

            // Paredes arquitectónicas principales
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
            const trimMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.5 });

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(21, 4.6, 0.3), wallMat);
            backWall.position.set(0, 2.3, -7.2);
            backWall.receiveShadow = true;
            officeGroup.add(backWall);

            // Ventanal panorámico trasero
            const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(10.4, 2.7, 0.36), trimMat);
            windowFrame.position.set(0, 2.35, -7.2);
            officeGroup.add(windowFrame);

            const cityTex = createCitySkylineTexture();
            const windowGlass = new THREE.Mesh(
                new THREE.PlaneGeometry(10.0, 2.45),
                new THREE.MeshBasicMaterial({ map: cityTex })
            );
            windowGlass.position.set(0, 2.35, -7.01);
            officeGroup.add(windowGlass);

            // Pared izquierda y derecha
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.6, 17.5), wallMat);
            leftWall.position.set(-9.6, 2.3, 1.4);
            leftWall.receiveShadow = true;
            officeGroup.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.6, 17.5), wallMat);
            rightWall.position.set(9.6, 2.3, 1.4);
            rightWall.receiveShadow = true;
            officeGroup.add(rightWall);

            // Pizarra Scrum / Arquitectura en pared trasera izquierda
            buildScrumBoard(officeGroup, -6.8, 2.2, -7.02);

            // Mesa de reuniones central de cristal
            buildMeetingTable(officeGroup, 0, 0.4);

            // 1. ESTACIÓN GOURMET DE CAFÉ Y MÁQUINA EXPENDEDORA DE SNACKS (Esquina trasera derecha)
            buildCafeAndSnacksZone(officeGroup, 7.2, -5.4);

                    leg.position.set(lx, 0.38, lz);

        function registerCharacterEntity(charRig, agent, localX, localZ, chairMesh) {
            const cos = Math.cos(agent.rotationY);
            const sin = Math.sin(agent.rotationY);
            const worldX = agent.position.x + localX * cos + localZ * sin;
            const worldZ = agent.position.z - localX * sin + localZ * cos;

            charRig.root.position.set(worldX, 0, worldZ);
            charRig.root.rotation.y = agent.rotationY;
            charRig.root.traverse(child => {

        /**

        function createFloatingAgentBoard(agent) {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 300;
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;

            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(2.55, 1.2, 1);
            sprite.userData.canvas = canvas;
            sprite.userData.texture = texture;

            updateFloatingBoardCanvas(sprite, agent);
            return sprite;
        }

        function updateFloatingBoardCanvas(sprite, agent) {
            if (!sprite || !sprite.userData || !sprite.userData.canvas) return;
            const canvas = sprite.userData.canvas;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            roundRect(ctx, 12, 12, w - 24, h - 38, 28);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = agent.accentColor;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(w / 2 - 18, h - 26);
            ctx.lineTo(w / 2 + 18, h - 26);
            ctx.lineTo(w / 2, h - 6);
            ctx.closePath();
            ctx.fillStyle = agent.accentColor;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(46, 56, 11, 0, Math.PI * 2);
            ctx.fillStyle = agent.accentColor;
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 34px Inter, sans-serif';
            ctx.fillText(agent.name, 70, 67);

            ctx.fillStyle = agent.accentColor;
            ctx.font = '600 21px Inter, sans-serif';
            ctx.fillText(agent.role.toUpperCase(), 36, 104);

            ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(36, 122);
            ctx.lineTo(w - 36, 122);
            ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 16px Inter, sans-serif';
            ctx.fillText('ÚLTIMO EN BITÁCORA:', 36, 148);

            ctx.fillStyle = '#f1f5f9';
            ctx.font = '500 22px Inter, sans-serif';
            wrapCanvasText(ctx, `"${agent.lastMessage}"`, 36, 180, w - 72, 28);

            sprite.userData.texture.needsUpdate = true;
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line.trim(), x, currentY);
        }

        /**
         * TEXTURAS PROCEDURALES
         */
        function createFloorTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#27272a';
            ctx.fillRect(0, 0, 512, 512);

            for (let y = 0; y < 512; y += 64) {
                ctx.fillStyle = (y / 64) % 2 === 0 ? '#2e2b29' : '#262423';
                ctx.fillRect(0, y, 512, 62);
                ctx.fillStyle = '#18181b';
                ctx.fillRect(0, y + 62, 512, 2);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 6);
            return tex;
        }

        function updateArcadeScreen(time) {
            if (!arcadeScreenCtx || !arcadeScreenTexture) return;
            const ctx = arcadeScreenCtx;
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, 512, 280);

            // Cuadrícula synthwave
            ctx.strokeStyle = 'rgba(192, 132, 252, 0.35)';
            ctx.lineWidth = 2;
            for (let x = 0; x < 512; x += 32) {
                ctx.beginPath();
                ctx.moveTo(x, 140);
                ctx.lineTo(x + (x - 256) * 0.6, 280);
                ctx.stroke();
            }
            for (let y = 140; y < 280; y += 24) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();
            }

            // Sol neón retro
            const grad = ctx.createLinearGradient(0, 30, 0, 140);
            grad.addColorStop(0, '#f59e0b');
            grad.addColorStop(1, '#ec4899');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(256, 120, 55, Math.PI, 0);
            ctx.fill();

            // Naves / Personajes moviéndose en pantalla
            const shipX = 256 + Math.sin(time * 2.5) * 140;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(shipX, 205);
            ctx.lineTo(shipX - 18, 235);
            ctx.lineTo(shipX + 18, 235);
            ctx.closePath();
            ctx.fill();

            // Proyectil láser
            const laserY = 200 - ((time * 180) % 140);
            ctx.fillStyle = '#34d399';
            ctx.fillRect(shipX - 3, laserY, 6, 16);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Inter, sans-serif';
            ctx.fillText('AI ARCADE • P1 vs P2', 20, 30);

            arcadeScreenTexture.needsUpdate = true;
        }

        function createCitySkylineTexture() {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 256;
            const ctx = c.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(0.65, '#1e3a8a');
            grad.addColorStop(1, '#38bdf8');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 256);

            for (let i = 0; i < 18; i++) {
                const bw = 24 + (i * 13) % 28;
                const bh = 60 + (i * 37) % 130;
                const bx = i * 29;
                ctx.fillStyle = '#090d16';
                ctx.fillRect(bx, 256 - bh, bw, bh);

                ctx.fillStyle = 'rgba(253, 224, 71, 0.55)';
                for (let wy = 256 - bh + 10; wy < 245; wy += 14) {
                    for (let wx = bx + 5; wx < bx + bw - 6; wx += 9) {
                        if ((wx + wy) % 3 === 0) ctx.fillRect(wx, wy, 4, 6);
                    }
                }
            }
            return new THREE.CanvasTexture(c);
        }

        /**
         * SISTEMA DE IA DE MOVIMIENTO E INTERACCIÓN POR LA OFICINA Y ZONAS RECREATIVAS
         */
        function scheduleOfficeActivity() {
            const roll = Math.random();
            if (roll < 0.45) {
                triggerPairInteraction();
            } else if (roll < 0.65) {
                triggerPingPongMatch();
            } else if (roll < 0.85) {
                triggerGamerSession();
            } else {
                triggerCafeOrSnackBreak();
            }
        }

        function triggerPairInteraction() {
            const shuffled = [...INTERACTION_SCRIPTS].sort(() => Math.random() - 0.5);
            for (const script of shuffled) {
                const entA = characterEntities.find(c => c.charId === script.a);
                const entB = characterEntities.find(c => c.charId === script.b);
                if (entA && entB && entA.state === 'seated' && entB.state === 'seated') {
                    const posA = new THREE.Vector3(script.spot.x - 0.52, 0, script.spot.z);
                    const posB = new THREE.Vector3(script.spot.x + 0.52, 0, script.spot.z);

                    entA.state = 'walking';
                    entA.targetPos.copy(posA);
                    entA.targetLookAt = posB.clone();
                    entA.partnerId = entB.charId;
                    entA.pendingState = 'interacting';
                    entA.stateTimer = 10;

                    entB.state = 'walking';
                    entB.targetPos.copy(posB);
                    entB.targetLookAt = posA.clone();
                    entB.partnerId = entA.charId;
                    entB.pendingState = 'interacting';
                    entB.stateTimer = 10;

                    entA.pendingSpeech = script.lineA;
                    entB.pendingSpeech = script.lineB;
                    entA.pendingLog = { agentId: script.logAgent, text: script.logText };
                    entB.pendingLog = null;
                    return;
                }
            }
        }

        function triggerPingPongMatch() {
            const script = PINGPONG_SCRIPTS[Math.floor(Math.random() * PINGPONG_SCRIPTS.length)];
            const entA = characterEntities.find(c => c.charId === script.a);
            const entB = characterEntities.find(c => c.charId === script.b);
            if (!entA || !entB || entA.state !== 'seated' || entB.state !== 'seated') return;

            const sideLeft = new THREE.Vector3(-5.8 - 1.65, 0, 6.2);
            const sideRight = new THREE.Vector3(-5.8 + 1.65, 0, 6.2);

            entA.state = 'walking';
            entA.targetPos.copy(sideLeft);
            entA.targetLookAt = sideRight.clone();
            entA.partnerId = entB.charId;
            entA.pendingState = 'pingpong';
            entA.stateTimer = 12;
            entA.pendingSpeech = script.lineA;
            entA.pendingLog = {
                agentId: entA.stationId,
                text: `Partida amistosa de Ping Pong entre ${entA.displayName} y ${entB.displayName}.`
            };

            entB.state = 'walking';
            entB.targetPos.copy(sideRight);
            entB.targetLookAt = sideLeft.clone();
            entB.partnerId = entA.charId;
            entB.pendingState = 'pingpong';
            entB.stateTimer = 12;
            entB.pendingSpeech = script.lineB;
            entB.pendingLog = null;
        }

        function triggerGamerSession() {
            const script = GAMING_SCRIPTS[Math.floor(Math.random() * GAMING_SCRIPTS.length)];
            const entA = characterEntities.find(c => c.charId === script.a);
            const entB = characterEntities.find(c => c.charId === script.b);
            if (!entA || !entB || entA.state !== 'seated' || entB.state !== 'seated') return;

            const gamerPos1 = new THREE.Vector3(5.4 - 0.55, 0, 6.1);
            const gamerPos2 = new THREE.Vector3(5.4 + 0.55, 0, 6.1);
            const tvTarget = new THREE.Vector3(5.4, 0, 7.35);

            entA.state = 'walking';
            entA.targetPos.copy(gamerPos1);
            entA.targetLookAt = tvTarget.clone();
            entA.partnerId = entB.charId;
            entA.pendingState = 'gaming';
            entA.stateTimer = 12;
            entA.pendingSpeech = script.lineA;
            entA.pendingLog = {
                agentId: entA.stationId,
                text: `Pausa gamer en el Rincón Arcade: ${entA.displayName} y ${entB.displayName}.`
            };

            entB.state = 'walking';
            entB.targetPos.copy(gamerPos2);
            entB.targetLookAt = tvTarget.clone();
            entB.partnerId = entA.charId;
            entB.pendingState = 'gaming';
            entB.stateTimer = 12;
            entB.pendingSpeech = script.lineB;
            entB.pendingLog = null;
        }

        function triggerCafeOrSnackBreak() {
            const seated = characterEntities.filter(c => c.state === 'seated');
            if (seated.length === 0) return;
            const chosen = seated[Math.floor(Math.random() * seated.length)];

            const isSnack = Math.random() > 0.5;
            chosen.state = 'walking';
            chosen.targetPos.set(isSnack ? 8.15 : 6.4, 0, -4.45);
            chosen.targetLookAt = new THREE.Vector3(isSnack ? 8.15 : 6.4, 0, -5.8);
            chosen.partnerId = null;
            chosen.pendingState = 'cafe';
            chosen.stateTimer = 8;
            chosen.pendingSpeech = CAFE_SNACK_LINES[Math.floor(Math.random() * CAFE_SNACK_LINES.length)];
        }

        function triggerGroupStandup() {
            const radius = 1.85;
            const center = new THREE.Vector3(0, 0, 0.4);
            characterEntities.forEach((ent, idx) => {
                const angle = (idx / characterEntities.length) * Math.PI * 2;
                const dest = new THREE.Vector3(
                    center.x + Math.cos(angle) * radius,
                    0,
                    center.z + Math.sin(angle) * radius
                );
                ent.state = 'walking';
                ent.targetPos.copy(dest);
                ent.targetLookAt = center.clone();
                ent.partnerId = null;
                ent.pendingState = 'standup';
                ent.stateTimer = 12;
                ent.activeSpeech = null;
            });

            const ribe = characterEntities.find(c => c.charId === 'ribe');
            if (ribe) {
                ribe.pendingSpeech = '¡Equipo, sincronización rápida en la mesa central!';
            }
            pushTeamLog('ribe', 'Reunión general de sincronización convocada en la mesa de cristal.');
            focusCamera('overview');
            showToast('🤝 Equipo reunido en la mesa central');
        }

        function sendAllToDesks() {
            characterEntities.forEach(ent => {
                ent.partnerId = null;
                ent.activeSpeech = null;
                ent.pendingSpeech = null;
                ent.pendingState = null;
                ent.rig.rightArm.cup.visible = false;
                if (ent.currentPos.distanceTo(ent.homePos) > 0.15) {
                    ent.state = 'returning';
                    ent.targetPos.copy(ent.homePos);
                    ent.targetLookAt = null;
                } else {
                    ent.state = 'seated';
                }
            });
            showToast('💻 Agentes regresando a sus estaciones');
        }

        function cycleSimSpeed() {
            const btn = document.getElementById('speed-btn');
            if (simSpeed === 1) {
                simSpeed = 2;
                btn.textContent = '⏩ 2x';
                showToast('Simulación acelerada (2x)');
            } else if (simSpeed === 2) {
                simSpeed = 0;
                btn.textContent = '⏸️ Pausa';
                showToast('Movimiento pausado');
            } else {
                simSpeed = 1;
                btn.textContent = '⏩ 1x';
                showToast('Velocidad normal (1x)');
            }
        }

        /**
         * ACTUALIZACIÓN CUADRO A CUADRO DE PERSONAJES, GLOBOS 3D Y ZONAS RECREATIVAS
         */
        function updateCharactersAndInteractions(delta, elapsed) {
            const dt = delta * simSpeed;

            // Animar pantalla retro del Rincón Gamer
            updateArcadeScreen(elapsed);

            // Verificar si hay alguien jugando Ping Pong para animar la pelota
            const pingPongPlayers = characterEntities.filter(c => c.state === 'pingpong');
            if (pingPongBallMesh) {
                if (pingPongPlayers.length > 0) {
                    const pingX = Math.sin(elapsed * 5.2) * 1.15;
                    const bounceY = 0.82 + Math.abs(Math.cos(elapsed * 5.2)) * 0.28;
                    const driftZ = Math.sin(elapsed * 2.6) * 0.35;
                    pingPongBallMesh.position.set(pingX, bounceY, driftZ);
                } else {
                    pingPongBallMesh.position.set(0.35, 0.81, 0.15);
                }
            }

            if (simSpeed > 0) {
                simTimer += dt;
                if (simTimer > 11.5) {
                    simTimer = 0;
                    scheduleOfficeActivity();
                }
            }

            characterEntities.forEach((ent, idx) => {
                const rig = ent.rig;

                if (ent.speechTimer > 0 && simSpeed > 0) {
                    ent.speechTimer -= dt;
                    if (ent.speechTimer <= 0) {
                        ent.activeSpeech = null;
                    }
                }

                if (ent.state === 'walking' || ent.state === 'returning') {
                    rig.bodyPivot.position.y = 0;
                    rig.bodyPivot.position.z = 0;
                    rig.rightArm.cup.visible = false;

                    const toTarget = new THREE.Vector3().subVectors(ent.targetPos, ent.currentPos);
                    toTarget.y = 0;
                    const dist = toTarget.length();

                    if (dist > 0.08 && simSpeed > 0) {
                        toTarget.normalize();

                        // Evasión suave entre compañeros
                        characterEntities.forEach(other => {
                            if (other !== ent) {
                                const diff = new THREE.Vector3().subVectors(ent.currentPos, other.currentPos);
                                diff.y = 0;
                                const d = diff.length();
                                if (d > 0.01 && d < 0.72) {
                                    toTarget.add(diff.normalize().multiplyScalar((0.72 - d) * 1.6));
                                }
                            }
                        });
                        toTarget.normalize();

                        const walkSpeed = 1.65;
                        ent.currentPos.addScaledVector(toTarget, Math.min(walkSpeed * dt, dist));
                        rig.root.position.copy(ent.currentPos);

                        const desiredAngle = Math.atan2(toTarget.x, toTarget.z);
                        rig.root.rotation.y = lerpAngle(rig.root.rotation.y, desiredAngle, 10 * dt);

                        ent.walkCycle += dt * 9.5;
                        const swing = Math.sin(ent.walkCycle) * 0.55;
                        rig.leftLeg.hipPivot.rotation.x = swing;
                        rig.rightLeg.hipPivot.rotation.x = -swing;
                        rig.leftLeg.kneePivot.rotation.x = Math.max(0, -swing * 0.8);
                        rig.rightLeg.kneePivot.rotation.x = Math.max(0, swing * 0.8);

                        rig.leftArm.shoulderPivot.rotation.x = -swing * 0.65;
                        rig.rightArm.shoulderPivot.rotation.x = swing * 0.65;
                        rig.leftArm.elbowPivot.rotation.x = -0.25;
                        rig.rightArm.elbowPivot.rotation.x = -0.25;

                        rig.bodyPivot.position.y = Math.abs(Math.sin(ent.walkCycle)) * 0.035;
                    } else if (dist <= 0.08) {
                        ent.currentPos.copy(ent.targetPos);
                        rig.root.position.copy(ent.currentPos);

                        if (ent.state === 'returning') {
                            ent.state = 'seated';
                            ent.stateTimer = 6 + Math.random() * 7;
                            rig.root.rotation.y = ent.homeRotY;
                        } else {
                            ent.state = ent.pendingState || 'interacting';
                            if (ent.state === 'cafe') {
                                rig.rightArm.cup.visible = true;
                            }
                            if (ent.pendingSpeech) {
                                ent.activeSpeech = ent.pendingSpeech;
                                ent.speechTimer = 6.5;
                                ent.pendingSpeech = null;
                            }
                            if (ent.pendingLog) {
                                pushTeamLog(ent.pendingLog.agentId, ent.pendingLog.text);
                                ent.pendingLog = null;
                            }
                        }
                    }

                    if (ent.state === 'interacting' && ent.partnerId) {
                        const partner = characterEntities.find(c => c.charId === ent.partnerId);
                        if (partner && partner.state === 'interacting') {
                            if (ent.pendingSpeech) {
                                ent.activeSpeech = ent.pendingSpeech;
                                ent.speechTimer = 6.5;
                                ent.pendingSpeech = null;
                            }
                            if (ent.pendingLog) {
                                pushTeamLog(ent.pendingLog.agentId, ent.pendingLog.text);
                                ent.pendingLog = null;
                            }
                        }
                    } else if ((ent.state === 'pingpong' || ent.state === 'gaming') && ent.pendingSpeech) {
                        ent.activeSpeech = ent.pendingSpeech;
                        ent.speechTimer = 6.5;
                        ent.pendingSpeech = null;
                        if (ent.pendingLog) {
                            pushTeamLog(ent.pendingLog.agentId, ent.pendingLog.text);
                            ent.pendingLog = null;
                        }
                    }
                } else {
                    // En su destino (sentado trabajando, conversando, café, pingpong, gaming o standup)
                    if (ent.state === 'seated') {
                        rig.bodyPivot.position.y = -0.05;
                        rig.bodyPivot.position.z = -0.04;
                        rig.leftLeg.hipPivot.rotation.x = -Math.PI / 2.1;
                        rig.rightLeg.hipPivot.rotation.x = -Math.PI / 2.1;
                        rig.leftLeg.kneePivot.rotation.x = Math.PI / 2.1;
                        rig.rightLeg.kneePivot.rotation.x = Math.PI / 2.1;

                        const typeWave = Math.sin(elapsed * 8 + idx) * 0.08;
                        rig.leftArm.shoulderPivot.rotation.x = -0.55 + typeWave;
                        rig.rightArm.shoulderPivot.rotation.x = -0.55 - typeWave;
                        rig.leftArm.elbowPivot.rotation.x = -0.85;
                        rig.rightArm.elbowPivot.rotation.x = -0.85;

                        rig.headGroup.rotation.y = Math.sin(elapsed * 0.9 + idx * 1.7) * 0.14;
                        rig.headGroup.rotation.x = 0.08;
                    } else {
                        rig.bodyPivot.position.y = Math.sin(elapsed * 2.2 + idx) * 0.012;
                        rig.bodyPivot.position.z = 0;
                        rig.leftLeg.hipPivot.rotation.x = 0;
                        rig.rightLeg.hipPivot.rotation.x = 0;
                        rig.leftLeg.kneePivot.rotation.x = 0;
                        rig.rightLeg.kneePivot.rotation.x = 0;

                        if (ent.targetLookAt && simSpeed > 0) {
                            const lookDir = new THREE.Vector3().subVectors(ent.targetLookAt, ent.currentPos);
                            const angle = Math.atan2(lookDir.x, lookDir.z);
                            rig.root.rotation.y = lerpAngle(rig.root.rotation.y, angle, 6 * dt);
                        }

                        if (ent.state === 'pingpong') {
                            // Movimiento de raqueta de ping pong
                            const swingArm = Math.sin(elapsed * 5.2 + idx * Math.PI) * 0.7;
                            rig.rightArm.shoulderPivot.rotation.x = -0.85 + swingArm;
                            rig.rightArm.elbowPivot.rotation.x = -0.7;
                            rig.leftArm.shoulderPivot.rotation.x = -0.2;
                            rig.leftArm.elbowPivot.rotation.x = -0.3;
                            rig.bodyPivot.position.y = Math.abs(Math.sin(elapsed * 5.2)) * 0.03;
                        } else if (ent.state === 'gaming') {
                            // Sosteniendo control inalámbrico y moviendo pulgares
                            const padMove = Math.sin(elapsed * 7 + idx) * 0.06;
                            rig.leftArm.shoulderPivot.rotation.x = -0.55 + padMove;
                            rig.rightArm.shoulderPivot.rotation.x = -0.55 - padMove;
                            rig.leftArm.elbowPivot.rotation.x = -0.95;
                            rig.rightArm.elbowPivot.rotation.x = -0.95;
                        } else if (ent.state === 'cafe') {
                            const sip = Math.sin(elapsed * 2.5) > 0.4 ? -1.15 : -0.45;
                            rig.rightArm.shoulderPivot.rotation.x = sip;
                            rig.rightArm.elbowPivot.rotation.x = -0.9;
                            rig.leftArm.shoulderPivot.rotation.x = 0;
                            rig.leftArm.elbowPivot.rotation.x = -0.2;
                        } else {
                            const gesture = Math.sin(elapsed * 4.5 + idx * 2) * 0.25;
                            rig.rightArm.shoulderPivot.rotation.x = -0.45 + gesture;
                            rig.rightArm.elbowPivot.rotation.x = -0.65;
                            rig.leftArm.shoulderPivot.rotation.x = -0.2;
                            rig.leftArm.elbowPivot.rotation.x = -0.35;
                        }
                        rig.headGroup.rotation.y = Math.sin(elapsed * 1.6 + idx) * 0.16;
                        rig.headGroup.rotation.x = -0.03;
                    }

                    if (simSpeed > 0) {
                        ent.stateTimer -= dt;
                        if (ent.stateTimer <= 0 && ent.state !== 'seated') {
                            ent.state = 'returning';
                            ent.targetPos.copy(ent.homePos);
                            ent.targetLookAt = null;
                            ent.partnerId = null;
                            ent.activeSpeech = null;
                        }
                    }
                }
            });

            // Actualizar proyección 2D de globos de diálogo 3D
            updateSpeechBubbles();

            // Seguimiento de cámara dinámico si está enfocado en un agente
            if (followedCharId) {
                const targetEnt = characterEntities.find(c => c.charId === followedCharId);
                if (targetEnt) {
                    const desiredLook = targetEnt.currentPos.clone().add(new THREE.Vector3(0, 1.05, 0));
                    const deltaMove = new THREE.Vector3().subVectors(desiredLook, controls.target);
                    controls.target.addScaledVector(deltaMove, 0.08);
                    camera.position.addScaledVector(deltaMove, 0.08);
                }
            }
        }

        function updateSpeechBubbles() {
            speechBubbleElements.forEach(item => {
                const ent = characterEntities.find(c => c.charId === item.charId);
                if (!ent || !ent.activeSpeech) {
                    item.el.classList.add('opacity-0');
                    return;
                }

                const headWorld = ent.currentPos.clone().add(new THREE.Vector3(0, 1.52, 0));
                headWorld.project(camera);

                if (headWorld.z > 1) {
                    item.el.classList.add('opacity-0');
                    return;
                }

                const x = (headWorld.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(headWorld.y * 0.5) + 0.5) * window.innerHeight;

                item.el.style.left = `${x}px`;
                item.el.style.top = `${y}px`;
                item.el.innerHTML = `<span class="font-bold text-sky-300 block mb-0.5">${ent.displayName}</span>${ent.activeSpeech}`;
                item.el.classList.remove('opacity-0');
            });
        }

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return a + diff * Math.min(1, t);
        }

        /**
         * INTERACTIVIDAD UI Y NAVEGACIÓN DE CÁMARA
         */
        function renderDeskNav() {
            const nav = document.getElementById('desk-nav');
            nav.innerHTML = '';

            AGENTS_DATA.forEach(agent => {
                const btn = document.createElement('button');
                btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-200 hover:bg-slate-800 transition whitespace-nowrap border border-transparent hover:border-slate-700';
                btn.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${agent.accentColor}"></span>
                    <span>${agent.name}</span>
                `;
                btn.onclick = () => focusAgentOrDesk(agent.id);
                nav.appendChild(btn);
            });

            // Accesos rápidos a las nuevas zonas recreativas
            const zones = [
                { id: 'pingpong', label: '🏓 Ping Pong' },
                { id: 'gamer', label: '🎮 Arcade' },
                { id: 'cafe', label: '☕ Café & Snacks' }
            ];
            zones.forEach(z => {
                const btn = document.createElement('button');
                btn.className = 'flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800 transition whitespace-nowrap border border-slate-700/60';
                btn.textContent = z.label;
                btn.onclick = () => focusCamera(z.id);
                nav.appendChild(btn);
            });
        }

        function renderLogFeed() {
            const feed = document.getElementById('log-feed');
            feed.innerHTML = '';

            teamLogs.forEach(entry => {
                const agent = AGENTS_DATA.find(a => a.id === entry.agentId) || AGENTS_DATA[0];
                const card = document.createElement('div');
                card.className = 'bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 hover:border-slate-700 transition cursor-pointer';
                card.onclick = () => focusAgentOrDesk(agent.id);
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full" style="background-color: ${agent.accentColor}"></span>
                            <span class="font-bold text-white">${agent.name}</span>
                            <span class="text-[10px] text-slate-400">(${agent.role.split('&')[0].trim()})</span>
                        </div>
                        <span class="text-[10px] text-slate-500 font-mono">${entry.time}</span>
                    </div>
                    <p class="text-slate-300 leading-relaxed">${entry.text}</p>
                `;
                feed.appendChild(card);
            });
            feed.scrollTop = feed.scrollHeight;
        }

        function pushTeamLog(agentId, messageText) {
            const agent = AGENTS_DATA.find(a => a.id === agentId);
            if (!agent) return;

            agent.lastMessage = messageText;
            const sprite = deskBoards[agentId];
            if (sprite) {
                updateFloatingBoardCanvas(sprite, agent);
            }

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            teamLogs.push({ agentId, time: timeStr, text: messageText });
            renderLogFeed();
        }

        function handlePostMessage(e) {
            e.preventDefault();
            const agentId = document.getElementById('agent-select').value;
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            pushTeamLog(agentId, text);
            input.value = '';

            const chars = characterEntities.filter(c => c.stationId === agentId);
            if (chars.length > 0) {
                chars[0].activeSpeech = text;
                chars[0].speechTimer = 6.0;
            }

            const agent = AGENTS_DATA.find(a => a.id === agentId);
            focusAgentOrDesk(agentId);
            showToast(`Cartel de ${agent.name} actualizado`);
        }

        function triggerAutoDialogue() {
            scheduleOfficeActivity();
            showToast('Nueva actividad iniciada en la oficina');
        }

        function focusAgentOrDesk(agentId) {
            const ent = characterEntities.find(c => c.stationId === agentId);
            if (ent && ent.state !== 'seated') {
                followedCharId = ent.charId;
                const offset = new THREE.Vector3(0, 2.3, 3.2);
                cameraTargetPos.copy(ent.currentPos).add(offset);
                cameraLookAtTarget.copy(ent.currentPos).add(new THREE.Vector3(0, 1.05, 0));
                isCameraTransitioning = true;
                showToast(`Siguiendo a ${ent.displayName} en movimiento`);
            } else {
                focusCamera(agentId);
            }
        }

        function focusCamera(targetId) {
            followedCharId = null;

            if (targetId === 'overview') {
                cameraTargetPos.set(0, 10.5, 13.5);
                cameraLookAtTarget.set(0, 1.0, 0.2);
                isCameraTransitioning = true;
                showToast('Vista general de la oficina');
                return;
            }
            if (targetId === 'pingpong') {
                cameraTargetPos.set(-5.8, 3.6, 10.2);
                cameraLookAtTarget.set(-5.8, 1.0, 6.2);
                isCameraTransitioning = true;
                showToast('🏓 Zona de Ping Pong');
                return;
            }
            if (targetId === 'gamer') {
                cameraTargetPos.set(5.8, 3.6, 2.2);
                cameraLookAtTarget.set(5.8, 1.1, 6.2);
                isCameraTransitioning = true;
                showToast('🎮 Rincón Gamer & Arcade');
                return;
            }
            if (targetId === 'cafe') {
                cameraTargetPos.set(6.8, 3.4, -1.2);
                cameraLookAtTarget.set(7.2, 1.2, -5.2);
                isCameraTransitioning = true;
                showToast('☕ Estación de Café & Máquina de Snacks');
                return;
            }

            const agent = AGENTS_DATA.find(a => a.id === targetId);
            if (!agent) return;

            const dirX = Math.sin(agent.rotationY);
            const dirZ = Math.cos(agent.rotationY);
            cameraTargetPos.set(
                agent.position.x - dirX * 3.8,
                2.8,
                agent.position.z - dirZ * 3.8 + 1.8
            );
            cameraLookAtTarget.set(agent.position.x, 1.55, agent.position.z);
            isCameraTransitioning = true;

            document.getElementById('agent-select').value = agent.id;
            showToast(`Estación de ${agent.name} — ${agent.role}`);
        }

        function toggleLogPanel() {
            const panel = document.getElementById('log-panel');
            panel.classList.toggle('translate-x-[120%]');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.style.opacity = '0';
            }, 2400);
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            renderer.domElement.addEventListener('pointerdown', (event) => {
                if (event.button !== 0 && event.pointerType === 'mouse') return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactiveMeshes, false);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit.userData && hit.userData.charId) {
                        const ent = characterEntities.find(c => c.charId === hit.userData.charId);
                        if (ent) {
                            followedCharId = ent.charId;
                            cameraTargetPos.copy(ent.currentPos).add(new THREE.Vector3(0, 2.2, 3.0));
                            cameraLookAtTarget.copy(ent.currentPos).add(new THREE.Vector3(0, 1.05, 0));
                            isCameraTransitioning = true;
                            document.getElementById('agent-select').value = ent.stationId;
                            showToast(`Siguiendo a ${ent.displayName}`);
                            return;
                        }
                    }
                    if (hit.userData && hit.userData.agentId) {
                        focusCamera(hit.userData.agentId);
                    }
                }
            });
        }

        /**
         * BUCLE PRINCIPAL DE RENDERIZADO 3D
         */
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            updateCharactersAndInteractions(delta, elapsed);

            if (isCameraTransitioning) {
                camera.position.lerp(cameraTargetPos, 0.06);
                controls.target.lerp(cameraLookAtTarget, 0.08);
                if (camera.position.distanceTo(cameraTargetPos) < 0.05) {
                    isCameraTransitioning = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
