[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perseo-database"
version = "0.1.0"
description = "Database layer for monthly supplier service indicators"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.15,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0"]
powerbi = ["pbixray>=0.15.5,<0.16"]

[project.scripts]
perseo-db = "perseo_db.cli:main"

[tool.setuptools]
packages = ["perseo_db"]
package-dir = {perseo_db = "Back End/HACEB_BACKEND/perseo_db"}

[tool.pytest.ini_options]
testpaths = ["Back End/HACEB_BACKEND/tests"]
pythonpath = ["Back End/HACEB_BACKEND"]

